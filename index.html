<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="sk2.webp">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Kirrane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #09090b;
            --text-muted: #52525b;
            --accent: #4f46e5;
            --border: #cbd5e1; 
            --badge-bg: #e0e7ff;
            --badge-text: #3730a3;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 80px 20px;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 60px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 35px;
        }

        .tagline-badge {
            display: inline-block;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 4.2rem;
            font-weight: 400;
            margin: 0 0 5px 0;
            color: var(--text-main);
            letter-spacing: -0.01em;
            line-height: 1;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin: 0 0 25px 0;
            font-weight: 500;
        }

        .links-nav a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin-right: 24px;
            font-size: 0.95rem;
        }

        .links-nav a:hover {
            text-decoration: underline;
        }

        .intro {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 60px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03), 0 2px 4px -2px rgba(0,0,0,0.03);
        }

        .section-title {
            font-size: 1.4rem;
            font-family: 'Instrument Serif', serif;
            font-weight: 400;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            margin-bottom: 30px;
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 35px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03), 0 2px 4px -2px rgba(0,0,0,0.03);
            position: relative;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            border-color: var(--accent);
        }

        .card-split {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 30px;
        }

        .card-text {
            flex: 1;
        }

        .card-logo-box {
            width: 110px;
            height: 110px;
            flex-shrink: 0;
            background-color: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .card-logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card h3 {
            margin-top: 0;
            font-family: 'Instrument Serif', serif;
            font-size: 2.1rem;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1
