      <main>
        <h1>Simon Kirrane — Content Director</h1>
        <p>Selected content direction, digital publishing, and Generative Engine Optimization (GEO) case studies across B2B SaaS and consumer media.</p>
        <section>
          <h2>Kolekti &amp; Mosaic: Templates Convert (2023–2026)</h2>
          <p>Built a bottom-of-funnel Confluence templates and frameworks strand around Mosaic, growing kolekti.com from 0 to ~8,400 organic keywords by May 2024 (SEMrush), scaling monthly active users from 6,600 to 36,000, increasing monthly organic traffic by 171% (Google Analytics), and launching the Jon Kern Agile Framework.</p>
        </section>
        <section>
          <h2>Future plc: Advnture.com Concept-to-Market Launch (2019–2022)</h2>
          <p>Led the concept-to-market launch of Advnture.com in 6 weeks while managing editorial teams across heritage and specialist titles at Future plc, generating revenue by month 3 and scaling to 8.4 million quarterly visits by Q3 2022 (Google Analytics).</p>
        </section>
        <section>
          <h2>Canon EMEA Ambassador Programme Launch (2016–2019)</h2>
          <p>Delivered content strategy and global editorial workflows for the Canon EMEA Ambassador launch, creating evergreen creator profiles built as product use-case overviews.</p>
        </section>
        <section>
          <h2>KOB Publishing: W42ST Hyperlocal Brand Launch in New York (2014–2016)</h2>
          <p>Co-founded KOB Publishing and launched the 100-page hyperlocal print and digital brand W42ST in Hell's Kitchen in three months with a 20,000 print run.</p>
        </section>
        <section>
          <h2>AI &amp; GEO Strategy, Playbooks &amp; Atlassian Rovo Macro Workaround (2025–2026)</h2>
          <p>Authored the Signal semantic GEO guide, reworked an enterprise AI governance guide into The Generative AI Playbook, and engineered a June 2026 prompt workaround enabling Atlassian Rovo to extract content inside Confluence macros.</p>
        </section>
      </main>
